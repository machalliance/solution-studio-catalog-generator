# Test-only stack. Kept separate from docker-compose.yml so nothing here touches the real
# catalog volumes: every service below works against a throwaway data directory.
#
#   docker compose -f docker-compose.test.yml run --rm unit     # vitest, in-process
#   docker compose -f docker-compose.test.yml run --rm e2e      # playwright, real browser
#   docker compose -f docker-compose.test.yml up -d app-e2e     # the UI on its own, to click through
services:

  # In-process suite: no ports, no network, no volumes — every test builds its own
  # temporary workspace under /tmp inside the container.
  unit:
    build:
      context: .
      dockerfile: Dockerfile.test
    # Source is mounted over the baked copy so an edit takes effect without a rebuild.
    # node_modules deliberately stays the image's own — sharp and the Playwright browsers
    # are platform-specific binaries and a host node_modules will not load here.
    volumes:
      - ./src:/app/src:ro
      - ./test:/app/test:ro
      - ./vitest.config.ts:/app/vitest.config.ts:ro
    command: npx vitest run

  # The app under test for the browser specs. A tmpfs data directory, so each run starts
  # from an empty catalog and nothing survives the container.
  app-e2e:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      PORT: 3004
      APP_ROOT: /app/e2e-data
      CONFIG_PATH: /app/e2e-data/config.json
      SITES_PATH: /app/e2e-data/sites.json
      # Deliberately unset: no spec depends on an LLM call succeeding, and one asserts
      # that a missing key surfaces as a visible error rather than a silent no-op.
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
    command: ["sh", "-c", "mkdir -p /app/e2e-data/data/catalog /app/e2e-data/data/images /app/e2e-data/data/backups /app/e2e-data/data/exports && exec node_modules/.bin/tsx src/server.ts"]
    tmpfs:
      - /app/e2e-data
    # Published on loopback so the same instance the specs drive can also be opened in a
    # browser on the host — the app binds every interface inside the container, and this
    # is what makes it reachable from outside it.
    ports:
      - "127.0.0.1:${E2E_PORT:-3005}:3004"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3004/health"]
      interval: 2s
      timeout: 3s
      retries: 15

  e2e:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    depends_on:
      app-e2e:
        condition: service_healthy
    environment:
      # Set, so playwright.config.ts skips its own webServer and drives the container above.
      BASE_URL: http://app-e2e:3004
    volumes:
      - ./src:/app/src:ro
      - ./test:/app/test:ro
      - ./playwright.config.ts:/app/playwright.config.ts:ro
    command: npx playwright test
