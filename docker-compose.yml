services:
  catalog-generator:
    build:
      context: .
      target: runtime
    ports:
      # Loopback by default: the container is reachable from this machine only. /api/* is
      # unauthenticated (it's the local UI's own backend — see requireAuth in server.ts) and
      # includes destructive routes and ones that trigger billed OpenAI/Anthropic calls, so
      # this must never be reachable from the open internet. Override BIND_ADDRESS=0.0.0.0
      # in your own .env (gitignored, never pushed) if you need to reach it from another
      # device on your own trusted network — the committed default stays loopback-only.
      # /catalog/* (token-gated via STUDIO_API_TOKEN) stays the safe way for other
      # devices/services to consume the catalog either way.
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3004}:3004"
    env_file: .env
    security_opt:
      - no-new-privileges:true
    # Overrides the image's default "node" user (UID 1000) to run as the host user instead.
    # Without this, writes to bind-mounted host directories fail with a permission error
    # whenever the host UID doesn't happen to be 1000 — e.g. CATALOG_HOST_PATH/
    # IMAGES_HOST_PATH pointing at another project's directory, owned by whoever's running
    # this, not by uid 1000. Set HOST_UID/HOST_GID in .env to `id -u`/`id -g` for your user.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    # All four data directories are relative bind mounts rather than named volumes, so the
    # catalog stays readable and editable from the host. catalog/images additionally read
    # their host-side source from CATALOG_HOST_PATH/IMAGES_HOST_PATH (.env) rather than a
    # fixed ./data path — empty means local to this checkout (the default, same as
    # backups/exports below); set them to point at another location on this machine (e.g. a
    # sibling project) so a different local tool can be pointed at the same files instead.
    volumes:
      - ./src:/app/src
      # Lets Settings write CATALOG_HOST_PATH/IMAGES_HOST_PATH back to the file
      # docker-compose itself reads them from — see the ENV_PATH comment in api.ts. Only
      # takes effect on the next `docker compose up`/`--force-recreate`, same as any other
      # edit to this file.
      - ./.env:/app/.env
      - ${CATALOG_HOST_PATH:-./data/catalog}:/app/data/catalog
      - ${IMAGES_HOST_PATH:-./data/images}:/app/data/images
      - ./data/backups:/app/data/backups
      - ./data/exports:/app/data/exports
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3004/health"]
      interval: 10s
      timeout: 5s
      retries: 5
