services:
  catalog-generator:
    build:
      context: .
      target: runtime
    ports:
      # Bound to the loopback interface only. /api/* is deliberately unauthenticated
      # (it's the local UI's own backend — see requireAuth in server.ts), so a bare
      # "3004:3004" would publish every mutating route to the whole LAN. Remote
      # consumers use the token-gated /catalog/* API via a reverse proxy instead.
      - "127.0.0.1:${PORT:-3004}:3004"
    env_file: .env
    security_opt:
      - no-new-privileges:true
    # All four data directories live under ./data in this checkout. They are relative
    # bind mounts rather than named volumes so the catalog stays readable and editable
    # from the host, and so another local tool can be pointed at the same files.
    volumes:
      - ./src:/app/src
      - ./data/catalog:/app/data/catalog
      - ./data/images:/app/data/images
      - ./data/backups:/app/data/backups
      - ./data/exports:/app/data/exports
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3004/health"]
      interval: 10s
      timeout: 5s
      retries: 5
