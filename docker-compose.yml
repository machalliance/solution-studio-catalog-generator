services:
  catalog-generator:
    build: .
    ports:
      # Bound to the loopback interface only. /api/* is deliberately unauthenticated
      # (it's the local UI's own backend — see requireAuth in server.ts), so a bare
      # "3004:3004" would publish every mutating route to the whole LAN. Remote
      # consumers use the token-gated /catalog/* API via a reverse proxy instead.
      - "127.0.0.1:${PORT:-3004}:3004"
    env_file: .env
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./src:/app/src
      - ../greeter/catalog/fixtures:/app/data/catalog
      - ../greeter/catalog/images:/app/data/images
      - ./data/backups:/app/data/backups
      - ./data/exports:/app/data/exports
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3004/health"]
      interval: 10s
      timeout: 5s
      retries: 5
